services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: flights, POSTGRES_USER: flight, POSTGRES_PASSWORD: flight}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flights"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://flight:flight@postgres:5432/flights
      FLIGHTPOWERS_API_KEY: ${FLIGHTPOWERS_API_KEY:-}
      DATACRAWLER_API_KEY: ${DATACRAWLER_API_KEY:-}
      DATACRAWLER_MAX_REQUESTS_PER_RUN: ${DATACRAWLER_MAX_REQUESTS_PER_RUN:-5}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      TRAVELPAYOUTS_API_TOKEN: ${TRAVELPAYOUTS_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://flight:flight@postgres:5432/flights
      FLIGHTPOWERS_API_KEY: ${FLIGHTPOWERS_API_KEY:-}
      DATACRAWLER_API_KEY: ${DATACRAWLER_API_KEY:-}
      DATACRAWLER_MAX_REQUESTS_PER_RUN: ${DATACRAWLER_MAX_REQUESTS_PER_RUN:-5}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      TRAVELPAYOUTS_API_TOKEN: ${TRAVELPAYOUTS_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m app.worker
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: {postgres_data: {}}
